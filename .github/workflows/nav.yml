# After every push to main: rebuild the index and the "Linked from" footers.
# See scripts/nav.py. The bot commits only when something changed,
# so remember to `git pull` before you start working.
name: nav

on:
  push:
    branches: [main]
    paths: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nav
  cancel-in-progress: false

jobs:
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/nav.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nav: update index and backlinks"
          git pull --rebase origin main
          git push
